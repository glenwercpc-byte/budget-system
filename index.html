<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCPC 예산 편성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: ledger workbook — slim top bar, team ledger cards, account sections as ruled ledgers with a sticky totals strip */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#f8fafb; --ink:#16212c; --muted:#5a6775; --line:#d8dfe6; --line-2:#e9eef2;
  --accent:#1c4d70; --accent-ink:#ffffff; --accent-soft:#e2ecf4;
  --ok:#1d7349; --ok-soft:#e1f2e8; --warn:#9a5a06; --warn-soft:#fbefdc; --bad:#ad2a22; --bad-soft:#fbe5e3; --info:#2756a3; --info-soft:#e4ecfa; --idle:#6b7682; --idle-soft:#eceff2;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --title:#123a63; --cat-bg:#eaf3fc;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#19232c; --ink:#e4eaf0; --muted:#94a2b0; --line:#2a3642; --line-2:#202b35;
  --accent:#86b8dd; --accent-ink:#0e141a; --accent-soft:#1b2d3c;
  --ok:#5cc28c; --ok-soft:#14301f; --warn:#e3a94e; --warn-soft:#33260f; --bad:#f08178; --bad-soft:#3a1a18; --info:#8fb0ee; --info-soft:#18243a; --idle:#97a3ae; --idle-soft:#212b34;
  --title:#a9cdf0; --cat-bg:#1a2a3a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#19232c; --ink:#e4eaf0; --muted:#94a2b0; --line:#2a3642; --line-2:#202b35;
  --accent:#86b8dd; --accent-ink:#0e141a; --accent-soft:#1b2d3c;
  --ok:#5cc28c; --ok-soft:#14301f; --warn:#e3a94e; --warn-soft:#33260f; --bad:#f08178; --bad-soft:#3a1a18; --info:#8fb0ee; --info-soft:#18243a; --idle:#97a3ae; --idle-soft:#212b34;
  --title:#a9cdf0; --cat-bg:#1a2a3a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.demo-flag{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:99px;font-weight:600}

main{padding-block:24px 120px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:68ch}

/* guidance */
details.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px}
details.guide summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"펼치기";font-weight:400;color:var(--muted);font-size:13px}
details.guide[open] summary::after{content:"접기"}
.guide-body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mcard{border:1px solid var(--line-2);background:var(--surface-2);border-radius:6px;padding:12px 14px}
.mcard h4{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:center}
.mcard p{margin:0;font-size:13.5px;color:var(--muted)}
.mcard code{font-family:var(--f-num);font-size:12.5px;background:var(--surface);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink)}

/* method tags */
.mt{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;letter-spacing:.02em}
.mt.FIXED{background:var(--info-soft);color:var(--info)}
.mt.VAR{background:var(--accent-soft);color:var(--accent)}
.mt.ONCE{background:var(--warn-soft);color:var(--warn)}
.mt.NEW{background:var(--ok-soft);color:var(--ok)}
.mt.EXCL{background:var(--idle-soft);color:var(--idle)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.s-none{background:var(--idle-soft);color:var(--idle)}
.pill.s-작성중{background:var(--warn-soft);color:var(--warn)}
.pill.s-제출{background:var(--info-soft);color:var(--info)}
.pill.s-승인{background:var(--ok-soft);color:var(--ok)}
.pill.s-반려{background:var(--bad-soft);color:var(--bad)}

/* overview strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.strip > div{background:var(--surface);padding:12px 16px}
.strip .k{font-size:12.5px;color:var(--muted)}
.strip .v{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.strip .v.small{font-size:16px}

/* team grid */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.team:hover{border-color:var(--accent)}
.team .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team h3{font-size:16.5px;font-weight:700}
.team .accts{font-family:var(--f-num);font-size:12px;color:var(--muted);word-break:break-word}
.team .fig{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--line-2);padding-top:8px}
.team .fig span{display:block;font-size:11.5px;color:var(--muted)}
.team .fig b{font-family:var(--f-num);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.team .lock{font-size:12px;color:var(--muted)}
.team.rev{border-style:dashed}

/* editor */
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
.notice{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:var(--surface)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.notice.ok{border-color:var(--ok);background:var(--ok-soft)}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.acct-h{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.acct-h .t{display:flex;gap:10px;align-items:baseline;min-width:0;flex-wrap:wrap}
.acct-h .code{font-family:var(--f-num);font-weight:600;color:var(--title);font-size:15px}
.acct-h h2{font-size:17px;font-weight:700;color:var(--title)}
.acct-h .en{font-size:13px;color:var(--title);font-weight:500}
.acct-figs{display:flex;gap:18px;flex-wrap:wrap}
.acct-figs div{display:flex;flex-direction:column;line-height:1.25}
.acct-figs span{font-size:11.5px;color:var(--muted)}
.acct-figs b{font-family:var(--f-num);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.acct-figs .prop b{font-weight:700;color:var(--accent);font-size:15.5px}
.delta{font-family:var(--f-num);font-size:12px}
.delta.up{color:var(--bad)} .delta.dn{color:var(--ok)}

.lines{overflow-x:auto}
.grid{display:grid;grid-template-columns:minmax(220px,2.4fr) 104px 128px 118px 70px 100px 112px 34px;gap:0 10px;align-items:center;padding:0 16px}
.ghead{font-size:11.5px;color:var(--muted);font-weight:600;padding-block:8px;border-bottom:1px solid var(--line-2);letter-spacing:.02em}
.ghead .r{text-align:right}
.line{border-bottom:1px solid var(--line-2);padding-block:10px 8px}
.line:last-of-type{border-bottom:0}
.line.excl .cat b,.line.excl .amt{color:var(--muted);text-decoration:line-through}
.cat{min-width:0}
.cat b{font-weight:600;font-size:14px;display:block;background:var(--cat-bg);color:var(--title);padding:3px 8px;border-radius:4px;margin:0 0 3px -8px}
.line.excl .cat b{background:transparent}
.cat input{width:100%}
.cat small{display:block;color:var(--muted);font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.cat .hint{color:var(--warn)}
.act{text-align:right;font-family:var(--f-num);font-size:13.5px;font-variant-numeric:tabular-nums}
.act small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
.line select{width:100%;height:34px;padding:0 6px;font-size:13.5px}
.line .nin{height:34px}
.nin{width:100%;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13.5px}
.nin:disabled{background:var(--surface-2);color:var(--muted)}
.blabel{grid-column:4 / 5;font-size:11.5px;color:var(--muted);text-align:right;margin-top:6px;align-self:center}
.amt{text-align:right;font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.why{grid-column:1 / 4;display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;min-width:0}
.why .auto{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:2px 8px;font-family:var(--f-num)}
.why input{flex:1 1 220px;min-width:0;font-size:13px;padding:5px 8px;border:1px dashed var(--line);border-radius:6px;background:transparent}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.del:hover{color:var(--bad)}
.acct-f{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap}
.lbl-m{display:none}

/* sticky footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{display:flex;align-items:center;gap:14px 22px;padding-block:10px;flex-wrap:wrap}
.foot .tot{display:flex;gap:20px;margin-right:auto;flex-wrap:wrap}
.foot .tot div{display:flex;flex-direction:column;line-height:1.2}
.foot .tot span{font-size:11.5px;color:var(--muted)}
.foot .tot b{font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums}
.foot .tot .big b{color:var(--accent);font-size:20px}
.dirty{font-size:12.5px;color:var(--warn);font-weight:600}
.saved{font-size:12.5px;color:var(--muted)}
.by{display:flex;gap:6px;align-items:center;font-size:13px}
.by input{width:120px}

/* login card */
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.login h2{font-size:19px}
.login p{margin:0;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}

/* admin table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px}
table.sum{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
.sum th,.sum td{padding:7px 12px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
.sum th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
.sum td.l,.sum th.l{text-align:left}
.sum td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sum tr.sec td{background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:left;font-size:14px}
.sum tr.team td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--line)}
.sum tr.sub td{font-weight:600;border-bottom:1px solid var(--line)}
.sum tr.grand td{font-weight:700;font-size:14.5px;background:var(--surface-2);border-top:2px solid var(--ink)}
.sum tr.acc{cursor:pointer}
.sum tr.acc:hover td{background:var(--surface-2)}
.sum tr.det td{font-size:12.5px;color:var(--muted);background:var(--bg);white-space:normal}
.sum .acts{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
.sum .cmt{font-weight:400;color:var(--bad);font-size:12.5px;margin-left:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:20px}
.panel h3{font-size:16px;margin-bottom:6px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px;max-width:72ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea.csv{width:100%;height:140px;font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.loading{padding:40px 0;color:var(--muted);text-align:center}

@media (max-width:860px){
  .lines{overflow:visible}
  .ghead{display:none}
  .grid{grid-template-columns:1fr 1fr;gap:8px 10px}
  .cat{grid-column:1 / -1}
  .act{text-align:left}
  .lbl-m{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .amt{text-align:left;font-size:17px}
  .blabel{display:none}
  .why{grid-column:1 / -1}
  .del{justify-self:end}
  .acct-figs{gap:12px}
  .top{position:static}
  .foot .tot{gap:14px}
  .foot .tot > div:nth-child(1),.foot .tot > div:nth-child(2){display:none}
  .foot .wrap{gap:8px 12px;padding-block:8px}
  .by input{width:96px}
  .foot .tot b{font-size:15px}
  .foot .tot .big b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand"><b>시카고 언약 장로교회 · 예산 편성</b><span id="brandSub">Chicago Covenant Presbyterian Church</span></div>
    <div class="ctl">
      <span class="demo-flag" id="demoFlag" hidden>데모 모드</span>
      <label for="yearSel" class="eyebrow" style="letter-spacing:.04em">예산 연도</label>
      <select id="yearSel"></select>
      <button class="btn ghost" id="homeBtn" type="button">팀 목록</button>
      <button class="btn" id="adminBtn" type="button">관리자 총괄</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">불러오는 중…</div></main>
<div class="foot" id="foot" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ════════ 설정 ════════
 * Apps Script 웹앱을 배포한 뒤 URL 을 아래에 붙여넣으세요.
 * 비워 두면 데모 모드(브라우저에만 저장)로 동작합니다. */
var API_URL = 'https://script.google.com/macros/s/AKfycbzf_22oeN4rla_ZLtfRjWzAvFrli5lul1x1z9OURupJTfszBrzNwEMqe-dkiF9cCProTg/exec';

var METHOD = {
  FIXED: { label: '매월 고정', basis: '월 금액', desc: '월 평균 × 12' },
  VAR:   { label: '변동', basis: '9개월 실적', desc: '9개월 실적 ÷ 9 × 12' },
  ONCE:  { label: '연1회·일회성', basis: '예정 금액', desc: '2027년 실제 예정액' },
  NEW:   { label: '신규 사역', basis: '예정 금액', desc: '신규/확대 사역 예정액' },
  EXCL:  { label: '제외', basis: '—', desc: '환불·조정 — 산출 제외' }
};
var DEMO = !API_URL;
var S = { init: null, year: null, team: null, data: null, lines: [], pw: {}, adminPw: '', dirty: false, summary: null };

/* ════════ 유틸 ════════ */
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n(x) { var v = Number(String(x == null ? '' : x).replace(/\u2212/g, '-').replace(/[$,\s]/g, '')); return isFinite(v) ? v : 0; }
function money(x, cents) { var v = n(x); var s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }); return (v < 0 ? '−$' : '$') + s; }
function pct(a, b) { if (!b) return a ? '신규' : '—'; var p = (a - b) / b * 100; return (p > 0 ? '+' : '') + p.toFixed(1) + '%'; }
function deltaCls(a, b) { return a > b ? 'up' : a < b ? 'dn' : ''; }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2600); }
function pill(st) { var s = st && st.status; return '<span class="pill s-' + (s || 'none') + '">' + (s || '미작성') + '</span>'; }

/* ════════ API ════════ */
function jsonp(params) {
  return new Promise(function (resolve, reject) {
    var cb = '__cb' + Date.now() + Math.floor(Math.random() * 1e4);
    var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); }).join('&');
    var s = document.createElement('script');

function demoApi(action, d) {

    db.status[key(d.team)] = { status: d.submit ? '제출' : (cur && cur.status === '반려' ? '반려' : '작성중'), by: d.by, at: now, comment: d.submit ? '' : (cur ? cur.comment : '') };
    store('ccpc-budget-demo', db);

  }

    var st2 = {}; seed.teams.forEach(function (t) { if (db.status[key(t.id)]) st2[t.id] = db.status[key(t.id)]; });

/* ════════ 계산 ════════ */
function defaultBasis(method, actual9) {
  if (method === 'FIXED') return Math.round(actual9 / 9 * 100) / 100;
  if (method === 'VAR') return Math.round(actual9 * 100) / 100;
  if (method === 'ONCE') return Math.max(0, Math.round(actual9 * 100) / 100);
  return 0;
}
function compute(L) {
  var base = n(L.basis), annual;
  if (L.method === 'FIXED') annual = base * 12;
  else if (L.method === 'VAR') annual = base / 9 * 12;
  else if (L.method === 'EXCL') annual = 0;
  else annual = base;
  var rate = L.method === 'EXCL' ? 0 : n(L.rate), adj = L.method === 'EXCL' ? 0 : n(L.adj);
  var amount = Math.round(annual * (1 + rate / 100) + adj);
  var why;
  if (L.method === 'FIXED') why = '월 ' + money(base, true) + ' × 12';
  else if (L.method === 'VAR') why = '9개월 실적 ' + money(base) + ' ÷ 9 × 12';
  else if (L.method === 'ONCE') why = '연 1회/일회성 예정액 ' + money(base);
  else if (L.method === 'NEW') why = '신규 사역 예정액 ' + money(base);
  else why = '환불·조정 항목 — 산출 제외';
  if (rate) why += ' × 인상 ' + rate + '%';
  if (adj) why += (adj > 0 ? ' + ' : ' − ') + '조정 ' + money(Math.abs(adj));
  return { amount: amount, auto: why };
}

function csv() {

document.addEventListener('toggle', function (e) { if (e.target.id === 'guide') store('ccpc-guide-closed', !e.target.open); }, true);
if (DEMO) $('#demoFlag').hidden = false;
function needDemo() {
  if (!DEMO || window.DEMO_SEED) return Promise.resolve();
  return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = 'demo-data.js'; s.onload = ok; s.onerror = function () { no(new Error('API_URL 이 설정되지 않았고 데모 데이터(demo-data.js)도 없습니다.')); }; document.head.appendChild(s); });
}
needDemo().then(function () { return loadInit(); }).then(function () {
  var h = location.hash.replace('#', '');
  if (h.indexOf('team-') === 0) openTeam(h.slice(5));
  else if (h === 'admin') openAdmin();
  else renderHome();
}).catch(function (e) { $('#app').innerHTML = '<div class="notice bad"><b>시작하지 못했습니다.</b> ' + esc(e.message) + '</div>'; });
</script>

</body>
</html>
